[project]
name = "python-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiorwlock>=1.5.0",
    "click>=8.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# === Ruff Configuration ===
# Replaces: black, flake8, isort
# Docs: https://docs.astral.sh/ruff/

[tool.ruff]
# Line length (black default: 88, your preference: 120)
line-length = 120

# Target Python version
target-version = "py311"

# Exclude directories
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
# Enable rule groups:
# - E/W: pycodestyle errors/warnings (flake8)
# - F: pyflakes (flake8)
# - I: isort (import sorting)
# - N: pep8-naming
# - UP: pyupgrade (modern Python syntax)
# - B: flake8-bugbear (common bugs)
# - C4: flake8-comprehensions
# - SIM: flake8-simplify
# - RUF: ruff-specific rules
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

# Ignore specific rules if needed
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults (FastAPI uses this)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# isort configuration (replaces isort)
known-first-party = ["app", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Formatter configuration (replaces black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
