[pytest]
# Pytest configuration for python-bridge telemetry tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Custom markers
markers =
    slow: marks tests as slow (run with: pytest -m slow)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    parser: marks parser-specific tests
    serial: marks serial reader tests
    bridge: marks bridge tests
    api: marks API endpoint tests

# Coverage options (used with --cov flag)
# Example: pytest --cov=app --cov-report=html
